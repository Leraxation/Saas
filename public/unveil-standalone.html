<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nocturne Vespera — The Unveiling</title>
<meta name="description" content="A scroll-driven unveiling: a grand tourer under silk, pulled back as you scroll, taken apart and put back together in one continuous shot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; padding: 0; background: #07070a; color: #efe8dc; }
#unveil-root { --font-display: "Syncopate"; --font-body: "Manrope"; --font-mono: "JetBrains Mono"; }
/* ───────────────────────────────────────────────────────────────────────────
   Nocturne · Vespera — the unveiling
   One pinned stage. The car does the talking; type arrives only when the
   fabric has left. Everything that moves is scrubbed by the scroll position.
   ─────────────────────────────────────────────────────────────────────────── */

.u-root {
  --ink: #07070a;
  --ink-2: #0d0d12;
  --bone: #efe8dc;
  --bone-2: rgba(239, 232, 220, 0.66);
  --bone-3: rgba(239, 232, 220, 0.38);
  --copper: #c98a3a;
  --copper-hi: #e8b26a;
  --teal: #3fb9c9;
  --hair: rgba(239, 232, 220, 0.14);

  --display: var(--font-display), "Syncopate", "Eurostile", "Bank Gothic", sans-serif;
  --body: var(--font-body), "Manrope", system-ui, -apple-system, sans-serif;
  --mono: var(--font-mono), "JetBrains Mono", ui-monospace, Menlo, monospace;

  --gutter: clamp(1rem, 4.5vw, 4.5rem);

  position: relative;
  background: var(--ink);
  color: var(--bone);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

.u-root *,
.u-root *::before,
.u-root *::after {
  box-sizing: border-box;
}

.u-root a {
  color: inherit;
  text-decoration: none;
}

/* ── Stage ──────────────────────────────────────────────────────────────── */

.u-pin {
  position: relative;
  height: 100vh;
  height: 100svh;
  width: 100%;
  overflow: hidden;
  background: var(--ink);
}

.u-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.u-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(7, 7, 10, 0.55) 100%),
    linear-gradient(to bottom, rgba(7, 7, 10, 0.45), transparent 22%, transparent 78%, rgba(7, 7, 10, 0.6));
}

.u-nowebgl {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--gutter);
  text-align: center;
  color: var(--bone-2);
  font-size: 0.95rem;
}

/* ── Chrome ─────────────────────────────────────────────────────────────── */

.u-chrome {
  position: absolute;
  left: 0;
  right: 0;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  padding: clamp(1rem, 2.4vw, 1.75rem) var(--gutter);
  pointer-events: none;
  z-index: 5;
}
.u-chrome--top {
  top: 0;
  align-items: flex-start;
}
.u-chrome--bottom {
  bottom: 0;
}
.u-chrome a {
  pointer-events: auto;
}

.u-wordmark {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.u-wordmark__name {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(0.78rem, 1.1vw, 0.95rem);
  letter-spacing: 0.34em;
  text-indent: 0.34em;
}
.u-wordmark__sub {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--bone-3);
}

.u-nav {
  display: flex;
  gap: clamp(0.9rem, 2.4vw, 2.2rem);
}
.u-nav__item {
  display: flex;
  gap: 0.5rem;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--bone-3);
  transition: color 0.35s ease;
}
.u-nav__idx {
  color: var(--bone-3);
}
.u-pin[data-chapter="cover"] .u-nav__item[data-id="cover"],
.u-pin[data-chapter="reveal"] .u-nav__item[data-id="reveal"],
.u-pin[data-chapter="anatomy"] .u-nav__item[data-id="anatomy"],
.u-pin[data-chapter="assembly"] .u-nav__item[data-id="assembly"] {
  color: var(--bone);
}
.u-pin[data-chapter="cover"] .u-nav__item[data-id="cover"] .u-nav__idx,
.u-pin[data-chapter="reveal"] .u-nav__item[data-id="reveal"] .u-nav__idx,
.u-pin[data-chapter="anatomy"] .u-nav__item[data-id="anatomy"] .u-nav__idx,
.u-pin[data-chapter="assembly"] .u-nav__item[data-id="assembly"] .u-nav__idx {
  color: var(--copper-hi);
}

.u-counter {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--bone-2);
}
.u-counter__idx {
  font-family: var(--display);
  font-size: 1.1rem;
  letter-spacing: 0.1em;
  color: var(--bone);
}
.u-counter__sep {
  width: 2.2rem;
  height: 1px;
  background: var(--copper);
  align-self: center;
}

.u-rail {
  position: absolute;
  right: var(--gutter);
  top: 50%;
  width: 1px;
  height: 34vh;
  transform: translateY(-50%);
  background: var(--hair);
  overflow: hidden;
}
.u-rail__fill {
  position: absolute;
  inset: 0;
  background: var(--copper-hi);
  transform-origin: top;
  transform: scaleY(0);
}

.u-cue {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--bone-2);
  clip-path: inset(0 0 0 0);
}
.u-cue__line {
  display: block;
  width: 3rem;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--bone-2));
  animation: u-cue-run 2.2s ease-in-out infinite;
  transform-origin: left;
}
@keyframes u-cue-run {
  0% { transform: scaleX(0); opacity: 0; }
  40% { transform: scaleX(1); opacity: 1; }
  100% { transform: scaleX(1) translateX(0.6rem); opacity: 0; }
}

/* ── Chapters ───────────────────────────────────────────────────────────── */

.u-chapter {
  position: absolute;
  z-index: 4;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  max-width: min(42rem, 80vw);
}
.u-chapter [data-line] {
  margin: 0;
  will-change: clip-path, transform;
}
.u-chapter a {
  pointer-events: auto;
}

.u-kicker {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--copper-hi);
  margin: 0 0 0.6rem;
}

.u-statement {
  font-family: var(--body);
  font-weight: 300;
  font-size: clamp(1.4rem, 3.1vw, 2.5rem);
  line-height: 1.12;
  letter-spacing: -0.015em;
  color: var(--bone);
}

.u-display {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2.4rem, 9.2vw, 8.5rem);
  line-height: 0.95;
  text-transform: uppercase;
  color: var(--bone);
  white-space: nowrap;
}
.u-display span {
  display: inline-block;
}
.u-display--sm {
  font-size: clamp(1.4rem, 4.2vw, 3.4rem);
  font-weight: 400;
}

.u-mono {
  font-family: var(--mono);
  font-size: clamp(0.7rem, 1vw, 0.82rem);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--copper-hi);
}

.u-lede {
  font-family: var(--body);
  font-weight: 300;
  font-size: clamp(1rem, 1.6vw, 1.35rem);
  line-height: 1.35;
  color: var(--bone-2);
  max-width: 34ch;
}

.u-chapter--cover {
  left: var(--gutter);
  bottom: clamp(5.5rem, 14vh, 9rem);
}
.u-chapter--reveal {
  left: var(--gutter);
  top: 50%;
  transform: translateY(-46%);
  max-width: none;
}
.u-chapter--anatomy {
  left: var(--gutter);
  bottom: clamp(5.5rem, 14vh, 9rem);
}
.u-chapter--assembly {
  right: var(--gutter);
  bottom: clamp(5.5rem, 14vh, 9rem);
  text-align: right;
  align-items: flex-end;
}
.u-chapter--finale {
  left: 50%;
  bottom: clamp(5.5rem, 13vh, 9rem);
  transform: translateX(-50%);
  align-items: center;
  text-align: center;
}
.u-chapter--finale .u-lede {
  text-align: center;
}

.u-cta {
  display: inline-flex;
  align-items: center;
  gap: 1rem;
  margin-top: 1.2rem;
  padding: 0.95rem 1.5rem 0.95rem 1.7rem;
  border: 1px solid var(--copper);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--bone);
  background: rgba(7, 7, 10, 0.35);
  backdrop-filter: blur(6px);
  transition: background 0.3s ease, border-color 0.3s ease;
}
.u-cta:hover,
.u-cta:focus-visible {
  background: rgba(201, 138, 58, 0.18);
  border-color: var(--copper-hi);
  outline: none;
}
.u-cta__arrow {
  transition: transform 0.3s ease;
}
.u-cta:hover .u-cta__arrow {
  transform: translateX(0.3rem);
}

/* ── Callouts (anchored to 3D parts each frame) ─────────────────────────── */

.u-callout {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 4;
  pointer-events: none;
  will-change: transform;
  transition: opacity 0.2s ease;
}
.u-callout__dot {
  position: absolute;
  left: -4px;
  top: -4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--copper-hi);
  box-shadow: 0 0 0 4px rgba(232, 178, 106, 0.18);
}
.u-callout__leader {
  position: absolute;
  top: 0;
  height: 1px;
  width: clamp(4rem, 8vw, 7.5rem);
  background: var(--copper-hi);
  transform-origin: left center;
}
.u-callout--right .u-callout__leader {
  left: 0;
  transform-origin: left center;
}
.u-callout--left .u-callout__leader {
  right: 0;
  transform-origin: right center;
}
.u-callout__label {
  position: absolute;
  top: -0.35rem;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  width: max-content;
  max-width: 16rem;
  transform: translateY(-100%);
}
.u-callout--right .u-callout__label {
  left: calc(clamp(4rem, 8vw, 7.5rem) + 0.6rem);
}
.u-callout--left .u-callout__label {
  right: calc(clamp(4rem, 8vw, 7.5rem) + 0.6rem);
  text-align: right;
  align-items: flex-end;
}
.u-callout__title {
  font-family: var(--display);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--bone);
}
.u-callout__detail {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  color: var(--bone-2);
}

/* ── After the stage ────────────────────────────────────────────────────── */

.u-after {
  position: relative;
  z-index: 2;
  padding: clamp(4rem, 10vh, 8rem) var(--gutter) 3rem;
  background: linear-gradient(to bottom, var(--ink), var(--ink-2));
  border-top: 1px solid var(--hair);
}

.u-after__head {
  max-width: 60rem;
  margin: 0 auto 2.5rem;
}
.u-after__head + .u-specs,
.u-after__head + .u-notes {
  margin-bottom: clamp(4rem, 10vh, 7rem);
}

.u-h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.4rem, 3.4vw, 2.6rem);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0 0 1rem;
}
.u-h2__thin {
  font-family: var(--body);
  font-weight: 300;
  text-transform: none;
  letter-spacing: -0.01em;
  color: var(--bone-2);
}
.u-note {
  font-weight: 300;
  color: var(--bone-2);
  line-height: 1.55;
  max-width: 60ch;
  margin: 0;
}

.u-specs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  gap: 0;
  max-width: 60rem;
  margin: 0 auto;
  border-top: 1px solid var(--hair);
}
.u-spec {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  padding: 1.3rem 1rem 1.3rem 0;
  border-bottom: 1px solid var(--hair);
}
.u-spec dt {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--copper-hi);
}
.u-spec dd {
  margin: 0;
  font-family: var(--body);
  font-weight: 300;
  font-size: clamp(1.2rem, 2vw, 1.6rem);
  letter-spacing: -0.01em;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.6rem;
}
.u-spec dd small {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.08em;
  color: var(--bone-3);
}

.u-notes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
  gap: 1px;
  max-width: 60rem;
  margin: 0 auto;
  background: var(--hair);
  border: 1px solid var(--hair);
}
.u-note-card {
  padding: 1.6rem 1.4rem 1.4rem;
  background: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.u-note-card h3 {
  margin: 0;
  font-family: var(--display);
  font-size: 0.78rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.u-note-card p {
  margin: 0;
  font-weight: 300;
  font-size: 0.9rem;
  line-height: 1.5;
  color: var(--bone-2);
}
.u-note-card strong {
  display: block;
  font-family: var(--mono);
  font-weight: 500;
  font-size: 0.6rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--copper-hi);
  margin-bottom: 0.25rem;
}
.u-note-card__where {
  margin-top: auto !important;
  font-family: var(--mono);
  font-size: 0.66rem !important;
  color: var(--bone-3) !important;
  padding-top: 0.6rem;
  border-top: 1px solid var(--hair);
}

.u-footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 1rem;
  max-width: 60rem;
  margin: 0 auto;
  padding-top: 2rem;
  border-top: 1px solid var(--hair);
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--bone-3);
}

/* ── Small screens ──────────────────────────────────────────────────────── */

@media (max-width: 720px) {
  .u-nav {
    display: none;
  }
  .u-rail {
    display: none;
  }
  .u-chapter {
    max-width: calc(100vw - 2 * var(--gutter));
  }
  .u-chapter--reveal {
    top: auto;
    bottom: clamp(5.5rem, 16vh, 9rem);
    transform: none;
  }
  .u-display {
    white-space: normal;
  }
  .u-callout__detail {
    display: none;
  }
  .u-callout__leader {
    width: 2.6rem;
  }
  .u-callout--right .u-callout__label {
    left: 3.2rem;
  }
  .u-callout--left .u-callout__label {
    right: 3.2rem;
  }
  .u-callout[data-anchor="canopy"],
  .u-callout[data-anchor="wheel"] {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .u-cue__line {
    animation: none;
    transform: none;
    opacity: 1;
  }
  .u-callout {
    transition: none;
  }
}

</style>
</head>

<div id="unveil-root"></div>
